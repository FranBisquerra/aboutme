name: CI

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create PR to develop
    if: |
      contains(github.event.head_commit.message, '#automerge') ||
      contains(github.event.head_commit.message, '#autodeploy')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Create PR and enable auto-merge
        run: |
          LABELS=""
          if echo "${{ github.event.head_commit.message }}" | grep -q "#autodeploy"; then
            LABELS="--label autodeploy"
          fi

          EXISTING_PR=$(gh pr list --head ${{ github.ref_name }} --base develop --json url --jq '.[0].url')

          if [ -n "$EXISTING_PR" ]; then
            PR_URL="$EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --base develop \
              --head ${{ github.ref_name }} \
              --title "Auto-merge: ${{ github.ref_name }}" \
              --body "Creado automáticamente desde el commit: \`${{ github.event.head_commit.message }}\`" \
              $LABELS)
          fi

          gh pr merge "$PR_URL" --auto --merge
