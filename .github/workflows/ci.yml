name: CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run tests
        run: ./gradlew test

  create-pr:
    name: Create PR to develop
    needs: test
    if: |
      github.ref_name != 'develop' &&
      (contains(github.event.head_commit.message, '#automerge') ||
       contains(github.event.head_commit.message, '#autodeploy'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Create PR and enable auto-merge
        run: |
          LABELS=""
          if echo "${{ github.event.head_commit.message }}" | grep -q "#autodeploy"; then
            LABELS="--label autodeploy"
          fi

          PR_URL=$(gh pr create \
            --base develop \
            --head ${{ github.ref_name }} \
            --title "Auto-merge: ${{ github.ref_name }}" \
            --body "Creado automáticamente desde el commit: \`${{ github.event.head_commit.message }}\`" \
            $LABELS)

          gh pr merge "$PR_URL" --auto --merge
