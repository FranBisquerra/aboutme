name: CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run tests
        run: ./gradlew test

  automerge:
    name: Merge to develop
    needs: test
    if: |
      github.ref_name != 'develop' &&
      (contains(github.event.head_commit.message, '#automerge') ||
       contains(github.event.head_commit.message, '#autodeploy'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge origin/${{ github.ref_name }} --no-ff -m "Auto-merge: ${{ github.ref_name }}"
          git push origin develop

  deploy:
    name: Deploy to production
    needs: automerge
    if: contains(github.event.head_commit.message, '#autodeploy')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Projects/aboutme
            git pull origin develop
            ./gradlew dockerRun -Pprofile=pro -x test
