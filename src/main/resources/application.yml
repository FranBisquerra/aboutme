spring:
  application:
    name: aboutme
  datasource:
    url: ${DB_URL:jdbc:mariadb://db:3306/aboutme}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:pwd}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

app:
  contact:
    recipient-email: francesc.bisquerra@gmail.com
    from-email: noreply@franbisquerra.dev
  security:
    jwt:
      # Override in production via JWT_SECRET (>= 32 bytes for HS256). The default is a
      # dev/test-only fallback so the app boots without env configuration.
      secret: ${JWT_SECRET:dev-insecure-secret-change-me-please-0123456789}
      expiration: 3600   # access token lifetime in seconds
    admin:
      # Initial admin user, created on startup if absent. Left empty by default (no-op);
      # set ADMIN_* in production / dev to provision it.
      username: ${ADMIN_USERNAME:}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
