plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fbisquerra'
version = '0.0.1-SNAPSHOT'
description = 'aboutme'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.6')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent("org.mockito:mockito-core") { transitive = false }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

/**
 * `bootRun` is the `dev` workflow: the backend runs as a local process, so it never sees the
 * environment that compose injects into the container. Load `.env` and map MARIADB_* onto the
 * DB_* variables the datasource reads, pointing at the db container's published port.
 *
 * This is what makes `./gradlew bootRun` work with no env vars configured in the IDE.
 */
tasks.named('bootRun') {
    def envFile = file('.env')
    if (envFile.exists()) {
        def env = [:]
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def separator = trimmed.indexOf('=')
                env[trimmed.substring(0, separator).trim()] = trimmed.substring(separator + 1).trim()
            }
        }
        env.each { key, value -> environment key, value }

        if (env.MARIADB_DATABASE) environment 'DB_URL', "jdbc:mariadb://localhost:3306/${env.MARIADB_DATABASE}"
        if (env.MARIADB_USER) environment 'DB_USERNAME', env.MARIADB_USER
        if (env.MARIADB_PASSWORD) environment 'DB_PASSWORD', env.MARIADB_PASSWORD
    }

    environment 'SPRING_PROFILES_ACTIVE', project.findProperty('profile') ?: 'dev'
}

def executeNpm(Exec task, List<String> args) {
    task.workingDir 'frontend'

    def profile = project.findProperty('profile') ?: 'local'

    if (profile == 'pro') {
        task.environment 'PATH', System.getenv('PATH')
        task.commandLine 'sh', '-c', "npm ${args.join(' ')}"
    } else {
        task.commandLine(['npm'] + args)
    }
}

tasks.register('installFrontend', Exec) {
    executeNpm(it, ['install'])
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'installFrontend'
    executeNpm(it, ['run', 'build'])
}

def composeFiles(String profile) {
    def files = ['docker', 'compose', '-f', 'infrastructure/docker/docker-compose.yml']
    if (profile == 'pro') {
        files += ['-f', 'infrastructure/docker/docker-compose.prod.yml']
    } else if (profile == 'dev') {
        files += ['-f', 'infrastructure/docker/docker-compose.dev.yml']
    } else {
        files += ['-f', 'infrastructure/docker/docker-compose.local.yml']
    }
    return files
}

tasks.register('dockerRun', Exec) {
    def profile = project.findProperty('profile') ?: 'local'

    def args
    if (profile == 'dev') {
        // dev: only spin up MariaDB; the backend/frontend run as local processes
        args = composeFiles(profile) + ['--env-file', '.env', 'up', '-d', 'db']
    } else {
        dependsOn 'bootJar', 'buildFrontend'
        args = composeFiles(profile) + ['--env-file', '.env', 'up', '--build', '-d']
    }

    doFirst {
        println "Starting with profile: ${profile}"
        println "Running: ${args.join(' ')}"
    }

    commandLine args
}

tasks.register('dockerStop', Exec) {
    def profile = project.findProperty('profile') ?: 'local'

    commandLine composeFiles(profile) + ['stop']

    doFirst {
        println "Stopping containers for profile: ${profile}"
    }
}

tasks.register('dockerStart', Exec) {
    def profile = project.findProperty('profile') ?: 'local'

    commandLine composeFiles(profile) + ['start']

    doFirst {
        println "Starting containers for profile: ${profile}"
    }
}
