plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fbisquerra'
version = '0.0.1-SNAPSHOT'
description = 'aboutme'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('installFrontend', Exec) {
    workingDir 'frontend'
    commandLine 'npm', 'install'
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'installFrontend'
    workingDir 'frontend'
    commandLine 'npm', 'run', 'build'
}

tasks.named('build') {
    dependsOn 'buildFrontend'
}

def composeFiles(String profile) {
    def files = ['docker', 'compose', '-f', 'infrastructure/docker/docker-compose.yml']
    if (profile == 'pro') {
        files += ['-f', 'infrastructure/docker/docker-compose.prod.yml']
    } else {
        files += ['-f', 'infrastructure/docker/docker-compose.local.yml']
    }
    return files
}

tasks.register('dockerRun', Exec) {
    def profile = project.findProperty('profile') ?: 'local'

    dependsOn 'build'

    def args = composeFiles(profile) + ['--env-file', '.env', 'up', '--build', '-d']

    doFirst {
        println "Starting with profile: ${profile}"
        println "Running: ${args.join(' ')}"
    }

    commandLine args
}

tasks.register('dockerStop', Exec) {
    def profile = project.findProperty('profile') ?: 'local'

    commandLine composeFiles(profile) + ['stop']

    doFirst {
        println "Stopping containers for profile: ${profile}"
    }
}

tasks.register('dockerStart', Exec) {
    def profile = project.findProperty('profile') ?: 'local'

    commandLine composeFiles(profile) + ['start']

    doFirst {
        println "Starting containers for profile: ${profile}"
    }
}
