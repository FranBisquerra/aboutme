name: aboutme

services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      RESEND_API_KEY: ${RESEND_API_KEY}

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
